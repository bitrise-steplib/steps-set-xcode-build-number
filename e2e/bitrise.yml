format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - PROJECT_ROOT: ./testdata/project/Example
  - PROJECT_FILE: Example.xcodeproj
  - WORKSPACE_ROOT: ./testdata/workspace/Example
  - WORKSPACE_FILE: Example.xcworkspace
  - GENERATED_NAME: Example
  - STATIC_NAME: Example-Static

workflows:
  test_workspace-with-generated-plist:
    envs:
    - STEP_PATH: $WORKSPACE_ROOT/$WORKSPACE_FILE
    - STEP_NAME: $GENERATED_NAME
    - STEP_TYPE: workspace
    - STEP_BUILD_ROOT: $WORKSPACE_ROOT
    - BUILD_VERSION: 9994
    - VERSION_OFFSET: 5
    - EXPECTED_BUILD_VERSION: 9999
    after_run:
    - _set-build-and-assert

  test_workspace-with-generated-plist-string-build-version:
    envs:
    - STEP_PATH: $WORKSPACE_ROOT/$WORKSPACE_FILE
    - STEP_NAME: $GENERATED_NAME
    - STEP_TYPE: workspace
    - STEP_BUILD_ROOT: $WORKSPACE_ROOT
    - BUILD_VERSION: 1.2.9999.3
    - VERSION_OFFSET: 0
    - EXPECTED_BUILD_VERSION: 1.2.9999.3
    after_run:
    - _set-build-and-assert

  test_workspace-with-static-plist:
    envs:
    - STEP_PATH: $WORKSPACE_ROOT/$WORKSPACE_FILE
    - STEP_NAME: $STATIC_NAME
    - STEP_TYPE: workspace
    - STEP_BUILD_ROOT: $WORKSPACE_ROOT
    - BUILD_VERSION: 9994
    - VERSION_OFFSET: 5
    - EXPECTED_BUILD_VERSION: 9999
    after_run:
    - _set-build-and-assert

  test_workspace-with-static-plist-skip-version-increment:
    envs:
    - STEP_PATH: $WORKSPACE_ROOT/$WORKSPACE_FILE
    - STEP_NAME: $STATIC_NAME
    - STEP_TYPE: workspace
    - STEP_BUILD_ROOT: $WORKSPACE_ROOT
    - BUILD_VERSION: 9999
    - VERSION_OFFSET: -1
    - EXPECTED_BUILD_VERSION: 9999
    after_run:
    - _set-build-and-assert

  test_workspace-with-static-plist-string-build-version:
    envs:
    - STEP_PATH: $WORKSPACE_ROOT/$WORKSPACE_FILE
    - STEP_NAME: $STATIC_NAME
    - STEP_TYPE: workspace
    - STEP_BUILD_ROOT: $WORKSPACE_ROOT
    - BUILD_VERSION: 1.2.9999.3
    - VERSION_OFFSET: 0
    - EXPECTED_BUILD_VERSION: 1.2.9999.3
    after_run:
    - _set-build-and-assert

  test_project-with-generated-plist:
    envs:
    - STEP_PATH: $PROJECT_ROOT/$PROJECT_FILE
    - STEP_NAME: $GENERATED_NAME
    - STEP_TYPE: project
    - STEP_BUILD_ROOT: $PROJECT_ROOT
    - BUILD_VERSION: 9994
    - VERSION_OFFSET: 5
    - EXPECTED_BUILD_VERSION: 9999
    after_run:
    - _set-build-and-assert

  test_project-with-static-plist:
    envs:
    - STEP_PATH: $PROJECT_ROOT/$PROJECT_FILE
    - STEP_NAME: $STATIC_NAME
    - STEP_TYPE: project
    - STEP_BUILD_ROOT: $PROJECT_ROOT
    - BUILD_VERSION: 9994
    - VERSION_OFFSET: 5
    - EXPECTED_BUILD_VERSION: 9999
    after_run:
    - _set-build-and-assert

  test_json_project_format:
    description: Only Xcode 27.2 and newer can read a project in the JSON project.xcproj format.
    steps:
    - script:
        title: Check if the current Xcode supports the JSON project format
        inputs:
        - content: |-
            #!/bin/env bash
            set -e
            version=$(xcodebuild -version | head -n 1 | awk '{print $2}')
            if printf '27.2\n%s\n' "$version" | sort -V -C; then
              envman add --key RUN_JSON_PROJECT_FORMAT_TEST --value true
            else
              echo "Xcode $version does not support the JSON project format, skipping"
            fi
    - bitrise-run:
        run_if: |-
          {{ enveq "RUN_JSON_PROJECT_FORMAT_TEST" "true" }}
        inputs:
        - workflow_id: utility_test_json_project_format
        - bitrise_config_path: ./e2e/bitrise.yml

  utility_test_json_project_format:
    envs:
    - STEP_PATH: ./_tmp/sample-apps-ios-json-xcproj.xcodeproj
    - STEP_NAME: sample-apps-ios-json-xcproj
    - STEP_TYPE: project
    - STEP_BUILD_ROOT: ./_tmp
    - BUILD_VERSION: 9994
    - VERSION_OFFSET: 5
    - EXPECTED_BUILD_VERSION: 9999
    steps:
    - script:
        title: Remove temp folder
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            rm -rf ./_tmp
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git@master:
        inputs:
        - repository_url: https://github.com/bitrise-io/sample-apps-ios-json-xcproj.git
        - branch: bitfall-signing
        - clone_into_dir: ./_tmp
    after_run:
    - _set-build-and-assert

  _set-build-and-assert:
    steps:
    - script:
        title: Remove build dir
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            rm -rf $STEP_BUILD_ROOT/build
    - path::./:
        run_if: "true"
        inputs:
        - project_path: $STEP_PATH
        - scheme: $STEP_NAME
        - target: $STEP_NAME
        - build_version: $BUILD_VERSION
        - build_version_offset: $VERSION_OFFSET
        - build_short_version_string: 9.99.9
        - verbose: "true"
    - xcode-build-for-simulator:
        title: Build app
        inputs:
        - project_path: $STEP_PATH
        - scheme: $STEP_NAME
        - configuration: Release
    - script:
        title: Check version and build numbers
        inputs:
        - content: |
            #!/bin/bash
            set -ex

            buildVersion=$(/usr/libexec/PlistBuddy "$BITRISE_APP_DIR_PATH/Info.plist" -c "print CFBundleVersion")
            buildShortVersion=$(/usr/libexec/PlistBuddy "$BITRISE_APP_DIR_PATH/Info.plist" -c "print CFBundleShortVersionString")

            if [ "$buildVersion" != "$EXPECTED_BUILD_VERSION" ]; then
              echo "CFBundleVersion is wrong"
              exit 1
            fi

            if [ "$buildShortVersion" != "9.99.9" ]; then
              echo "CFBundleShortVersionString is wrong"
              exit 1
            fi

            rm -r $BITRISE_APP_DIR_PATH
